# ang은 model_profiles에서 자동 설정됩니다.

# Operation parameter
img_mat: [512, 512, 608]
#img_mat: [256, 256, 608]
voxel: [1.0, 1.0, 1.0] # mm
#voxel: [2.0, 2.0, 1.0] # mm
filter_mode : 4
# 0 : Ram_Lak
# 1 : Shepp_Logan
# 2 : Cosine
# 3 : Hamming
# 4 : Hann
# 5 : None
d : 1 # cut off variable
n_thread : 256

# full-view parameter
full_angle : 360
full_view : 720
full_view_angle_offset : 0.0
full_view_tilt_angle : 0.0
full_SID : 1100.0
full_SOD : 700.0

# mbir parameter
iter_outer : 7
iter_inner : 4
alpha : 0.0001
beta : 0.1
rho : 10.0
mu : 1000.0
th : 0.0085


# Preprocessing-mode
pre_mode : 0
# 0 : TV
# 1 : BM3D
# else : None

# BM3D parameter
sigma_psd : 20
# TV parameter
lambda : 7.0
tau : 0.1
niter : 100

# Dataset split configuration (seed=42, 70/15/15 split)
dataset_split:
  train: ['0003', '0005', '0009', '0010', '0011', '0012', '0013', '0018', '0019', '0021', '0022', '0025',
          '0026', '0027', '0028', '0029', '0030', '0031', '0032', '0035', '0036', '0040', '0041', '0043',
          '0044', '0046', '0047', '0049', '0050', '0053', '0054', '0055', '0056', '0057', '0058', '0059',
          '0060', '0062', '0063', '0064', '0065', '0066', '0067', '0068', '0070', '0071', '0072', '0074',
          '0075', '0076', '0078']
  val: ['0008', '0015', '0038', '0045', '0048', '0051', '0052', '0069', '0073', '0077', '0079']
  test: ['0004', '0006', '0007', '0014', '0016', '0017', '0020', '0034', '0037', '0042', '0061']

# Normalization parameters per image size
normalization:
  # FBP input normalization.
  #
  # These were fitted to 9-VIEW FBP. A reconstruction from synthesised views has
  # a different intensity distribution (the streaks that inflated the tail are
  # largely gone), so reusing them would scale the input into the wrong range.
  # Recalibrate with step1c_calibrate_norm.py and fill in fbp_interp below.
  fbp:
    512:
      max_h: 0.51
      max_l: 0.37
    256:
      max_h: 0.47
      max_l: 0.37
    128:
      max_h: 0.47
      max_l: 0.31
  # Label (full-view FBP) normalization
  label:
    512:
      max_h: 0.39
      max_l: 0.29
    256:
      max_h: 0.38
      max_l: 0.28
    128:
      max_h: 0.38
      max_l: 0.27

# Training constants
training:
  z_slices: 608  # Number of slices per volume
  save_interval: 50  # Save checkpoint every N epochs
  max_rotate_degree: 90.0  # Data augmentation rotation range
  batch_sizes:  # Batch size per image size
    512: 32
    256: 8
    128: 16

